<header class="header">
  <h1>ポケモン図鑑ミニ</h1>
  <span class="fav-count" [attr.aria-label]="'お気に入り ' + favCount() + '件'">★ {{ favCount() }}</span>
</header>

<main class="main">
  <input
    class="search"
    type="search"
    placeholder="なまえで検索(例: ピカ / pika)"
    (input)="onSearch($event)"
  />

  <p class="meta">{{ filtered().length }} 匹</p>

  <div class="grid">
    @for (p of filtered(); track p.id) {
      <app-pokemon-card
        [pokemon]="p"
        [favorite]="favoriteIds().has(p.id)"
        (favoriteToggle)="toggleFavorite($event)"
      />
    } @empty {
      <p class="empty">見つかりませんでした</p>
    }
  </div>
</main>

<footer class="footer">
  <p>
    データ・画像:
    <a href="https://pokeapi.co" target="_blank" rel="noopener">PokeAPI ↗</a>
  </p>
</footer>
